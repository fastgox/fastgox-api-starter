# 测试环境配置
app:
  name: "FastGox API Starter Test"
  version: "1.0.0"
  env: "test"
  port: 19081
  debug: true
  shutdown_timeout: 5
  swagger:
    host: "/"
    scheme: "http"
    base_path: "/api/v1"

# 数据库配置 - 测试数据库（与开发库隔离）
database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  user: "root"
  password: "-"
  dbname: "fastgox_test"
  sslmode: "disable"
  timezone: "Asia/Shanghai"
  max_open_conns: 10
  max_idle_conns: 5
  log_level: "warn"
  auto_migrate: true
  migrations_dir: "docs/db"

# JWT配置 - 测试专用密钥
jwt:
  secret_key: "test-secret-key-do-not-use-in-prod"

# 短信验证码配置 - 测试宽松策略
sms-code:
  code-length: 4
  code-expire-time: 5
  daily-limit: 100
  interval-limit: 0
  recent-limit: 100
  recent-minutes: 60
  whitelist:
    - "13800138000"
  whitelist-code: "1234"

# TCP服务配置
tcp:
  enabled: false
  port: 19082
  max_connections: 100
  read_timeout: 60
  write_timeout: 10
  max_message_size: 65536
  heartbeat_timeout: 0

# 文件配置
file:
  max_size: 10485760
  max_count: 5
  allowed_extensions: [".jpg", ".jpeg", ".png", ".gif", ".pdf", ".txt"]
  upload_path: "test_uploads"
  url_prefix: "/static"
