basePath: /api/v1
definitions:
  dto.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  file.FileOutput:
    properties:
      code:
        description: 响应代码
        type: string
      cost_time:
        description: 耗时（毫秒）
        type: integer
      file_ext:
        description: 文件扩展名
        type: string
      file_name:
        description: 原始文件名
        type: string
      file_path:
        description: 文件相对路径
        type: string
      file_size:
        description: 文件大小
        type: integer
      file_url:
        description: 文件访问URL
        type: string
      message:
        description: 响应消息
        type: string
      provider:
        description: 服务提供商名称
        type: string
      request_id:
        description: 请求ID
        type: string
      saved_name:
        description: 保存的文件名
        type: string
      success:
        description: 操作是否成功
        type: boolean
      timestamp:
        description: 响应时间戳
        type: string
      upload_time:
        description: 上传时间
        type: string
    type: object
  request.LoginWithSmsRequest:
    properties:
      code:
        description: 验证码
        type: string
      phone:
        description: 手机号
        type: string
    required:
    - code
    - phone
    type: object
  request.SendLoginSmsRequest:
    properties:
      phone:
        description: 手机号
        type: string
    required:
    - phone
    type: object
  response.FileUploadResult:
    properties:
      file:
        allOf:
        - $ref: '#/definitions/file.FileOutput'
        description: 文件信息
      message:
        description: 响应消息
        type: string
      success:
        description: 上传是否成功
        type: boolean
    type: object
info:
  contact: {}
  description: fastgox-api-starter 贷款申请服务API
  title: fastgox-api-starter API
  version: "1.0"
paths:
  /auth/login-with-sms:
    post:
      consumes:
      - application/json
      description: 使用手机号和验证码登录，不存在账户时自动注册
      parameters:
      - description: 登录请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginWithSmsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: 登录失败
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 短信验证码登录
      tags:
      - 用户认证
  /auth/send-login-sms:
    post:
      consumes:
      - application/json
      description: 向指定手机号发送登录验证码
      parameters:
      - description: 发送短信请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.SendLoginSmsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 发送成功
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: 发送失败
          schema:
            $ref: '#/definitions/dto.Response'
      summary: 发送登录短信验证码
      tags:
      - 用户认证
  /file/upload/single:
    post:
      consumes:
      - multipart/form-data
      description: 上传单个文件
      parameters:
      - description: 上传的文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.FileUploadResult'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: 单文件上传
      tags:
      - 文件上传
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
